apiVersion: apps/v1
kind: Deployment
metadata:
  name: apollo-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: my-app-container
        image: dulyakit2542/my-k8s-app:latest  # เปลี่ยนเป็น image ของคุณ
        imagePullPolicy: Never
        ports:
        - containerPort: 4001  # Port ภายใน container
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: my-app-service
spec:
  selector:
    app: my-app  # ต้องตรงกับ matchLabels ใน Deployment
  ports:
    - protocol: TCP
      port: 4000       # Port ที่ Service expose (ภายนอก)
      targetPort: 4001  # Port ของ container (ภายใน)
  type: LoadBalancer

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: apollo-server-config
data:
  APP_ENV: "local"
  NODE_ENV: "development"
  NODE_PORT: "4000"
  CHAT_SERVICE: "http://192.168.0.15:8082"
  REDIS_HOST: ""
  REDIS_PORT: "17185"
  REDIS_PASSWORD: ""
  
